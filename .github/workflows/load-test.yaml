name: Load Test with JMeter

on:
  push:
    branches: [ main ]

jobs:
  load-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Java セットアップ
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: JMeterキャッシュ
        id: cache-jmeter
        uses: actions/cache@v4
        with:
          path: jmeter
          key: jmeter-5.6.3

      - name: JMeter インストール
        if: steps.cache-jmeter.outputs.cache-hit != 'true'
        run: |
          wget https://downloads.apache.org/jmeter/binaries/apache-jmeter-5.6.3.tgz
          tar -xf apache-jmeter-5.6.3.tgz
          mv apache-jmeter-5.6.3 jmeter

      - name: Node.js セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: 依存パッケージインストール
        run: npm ci

      - name: アプリ起動
        run: |
          node server/index.js &
          sleep 3

      - name: JMeter 負荷テスト実行
        run: |
          mkdir -p jmeter-report
          jmeter/bin/jmeter.sh -n -t Jmeter/ec-load-test.jmx -l Jmeter/result.jtl -e -o jmeter-report/

      - name: JMeterレポートを保存
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jmeter-report
          path: jmeter-report/
          retention-days: 30